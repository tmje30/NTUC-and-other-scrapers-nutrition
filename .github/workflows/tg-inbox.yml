name: Telegram inbox

# One run per Telegram update, delivered by the Cloudflare relay in `relay/`.
#
# ⚠️ **This is the cloud half of the texted-list flow, and it exists because the
# laptop sleeps.** On 2026-08-11 a grocery list texted at ~18:20 was answered at
# 21:11 — the laptop entered Modern Standby at 18:26 and Telegram held the message
# for two and three-quarter hours. Parsing a list, matching it to Ingredients and
# writing the grocery-list row need nothing but the Notion API, so they belong in
# the cloud where nothing sleeps.
#
# ⚠️ **`schedule:` was never an option here.** Free public repos queue cron runs by
# ~3–3¾ h (measured; HANDOVER "Infrastructure truths") — the exact latency this
# removes. Only `repository_dispatch` starts promptly, which is why a relay that can
# send one is needed at all.
#
# ⚠️ **Pricing a genuinely NEW item still does not happen here.** That means asking
# Sheng Siong, which challenges datacenter IPs. New items are left on the queue in
# `data/tg-inbox-state.json` and the laptop drains them (`npm run tg-drain`).
on:
  repository_dispatch:
    types: [tgupdate]

# NO concurrency group, deliberately — the same rule as `add-to-list.yml`. GitHub
# keeps only ONE pending run per group and cancels the rest, so a burst of taps
# would silently lose the middle ones (LEARNINGS 2026-07-30). Two runs writing the
# state file collide instead, and the three-way merge below resolves it.

jobs:
  handle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/tg-inbox-state.json and data/vendor-review.json
    outputs:
      # Whether this update actually changed the shopping list — set by
      # build-list-fragment, which compares the rows rather than the timestamp. A
      # /search, a button tap or a message that matched nothing leaves it false.
      listChanged: ${{ steps.fragment.outputs.changed }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The data files exactly as this run found them — the "base" of the three-way
      # merge used when a push is rejected. See the commit step.
      - name: Snapshot the data files
        run: |
          mkdir -p /tmp/data-base
          cp data/*.json /tmp/data-base/ 2>/dev/null || true

      - name: Handle the update
        run: npm run tg-handle
        env:
          # The Telegram update, verbatim, exactly as the relay received it.
          TG_UPDATE: ${{ toJSON(github.event.client_payload.update) }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ⚠️ **The fast half of the fix for "texted items take a long time to show up".**
      # Measured 2026-10-01: a list texted at 10:56 UTC was in Notion within ~30 s and did
      # not reach list.html for ~14 hours, because the only thing that publishes that page
      # is daily.yml and it runs the whole shop scan first. This writes the rows the page
      # fetches on load instead — Notion only, no shops, a few seconds.
      #
      # ⚠️ `if: always()` for the same reason the commit below is: the handler reports
      # per-update failures into the chat rather than throwing, so reaching here after a
      # failure means something structural — and a row that WAS written should still show.
      #
      # ⚠️ Its own `continue-on-error`: a Notion hiccup here must not fail a run whose
      # Notion write already succeeded and whose reply is already on the user's phone. The
      # page then stays a day behind, exactly as it did before any of this existed.
      - name: Snapshot the list for the page
        id: fragment
        if: always()
        continue-on-error: true
        run: npm run build-list-fragment
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      # ⚠️ `if: always()` — the state file must be committed even when the handler
      # failed. A run that asked a question and then died would otherwise leave the
      # question on screen with live buttons and no record of it anywhere, and the
      # tap would come back to a run that has never heard of the token. The handler
      # itself never throws for a per-update failure (it reports into the chat), so
      # reaching here after a failure means something structural — all the more
      # reason to keep whatever state was written.
      - name: Commit the inbox state
        if: always()
        # Needed only by the fragment regeneration inside the retry loop below.
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tg-inbox-state.json — outstanding questions + the unpriced queue.
          # vendor-review.json — price-book review taps answered from the same chat.
          # list-live.json — the rows list.html fetches on load. See the step above.
          git add data/tg-inbox-state.json data/vendor-review.json data/list-live.json
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data: telegram inbox state"

          # What this run meant to end up with. Captured ONCE, before the retry loop,
          # so every attempt re-applies this same intent onto the newest remote
          # rather than picking up a third run's work as if it were ours.
          mkdir -p /tmp/data-mine
          cp data/*.json /tmp/data-mine/ 2>/dev/null || true

          # ⚠️ Do NOT replace this with `git pull --rebase`. It replays the commit,
          # and two runs editing the same JSON list seconds apart is a content
          # conflict it cannot resolve — the run then dies AFTER the Notion row has
          # been written and the chat has already said it worked. See
          # src/core/merge-data.ts, and the three corrections lost on 2026-08-05.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected — re-merging onto the new remote (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            npx tsx src/scripts/merge-data.ts /tmp/data-base /tmp/data-mine data
            # ⚠️ **Regenerated, not merged.** list-live.json is derived from Notion, so two
            # runs racing it have no conflict to resolve — Notion already holds both rows,
            # and a fresh read is strictly truer than either side's copy. merge-data knows
            # nothing about this file (see DATA_FILES) and the reset above would otherwise
            # leave the other run's older snapshot in place.
            # GITHUB_OUTPUT is cleared for this call so the retry cannot append a second,
            # contradictory `changed=` line to the step output the rebuild job reads.
            GITHUB_OUTPUT= npm run build-list-fragment || true
            git add data/tg-inbox-state.json data/vendor-review.json data/list-live.json
            if git diff --staged --quiet; then
              echo "already applied upstream — nothing left to push"
              exit 0
            fi
            git commit -m "data: telegram inbox state"
          done
          echo "::error::could not push the inbox state after 5 attempts"
          exit 1

  # ⚠️ **The slow half of the same fix, and the one that makes the page itself correct.**
  # The snapshot above gets the rows onto the page in seconds, but the page is still the
  # one the last scan baked — its prices, its discounts and its totals are yesterday's.
  # This republishes it properly. ~4 minutes, almost all of it the shop scan.
  #
  # ⚠️ **Only when the list actually changed.** This workflow runs once per Telegram
  # update — every tap of every inline button included — and a full deals scan per tap
  # would hammer four shops and bury every real publish in the deployment history. That
  # is the same reason price-new-items.yml gates its own rebuild on an output.
  #
  # ⚠️ `quiet: true`: the digest belongs to the morning run. The inbox has already
  # replied in the chat with the ✅ lines and a link to the page, so a second Telegram
  # message here would be the third notification for one texted list.
  #
  # ⚠️ These permissions must be granted HERE, not only in daily.yml — a called
  # workflow's token is capped by the caller's. Inheriting `contents: write` alone would
  # strip `pages: write` and the deploy would fail after the scan had already run.
  rebuild:
    needs: handle
    if: needs.handle.outputs.listChanged == 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/daily.yml
    with:
      quiet: true
    secrets: inherit
