name: TEMP — Sheng Siong reachability from a US datacenter

# ⚠️ THROWAWAY DIAGNOSTIC, added 2026-08-11. Delete once it has answered.
#
# The question: every datacenter address that ever failed to reach Sheng Siong in
# this project was FOREIGN (GitHub Actions runs in US regions), and the datacenter
# address that succeeded on 2026-08-11 was in SINGAPORE. Hosting and geography have
# never been separated. This is the control.
#
# It deliberately does NOT run `build-site`: that would deploy the public Pages
# site and fire the Telegram digest at a chat with two people in it. This runs one
# live search and prints the result. No secrets, no writes, no deploy, no message.
#
# Reading the result:
#   products > 0        -> the US datacenter is NOT blocked. The hybrid may be
#                          obsolete entirely; nothing needs buying.
#   ERROR / 0 products  -> foreign datacenter still blocked while SG datacenter
#                          works => geography is the variable, and a Singapore VPS
#                          is very likely to work with no VPN.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Where this runner actually is
        run: curl -s https://ipinfo.io/json

      - name: Live Sheng Siong search (no secrets, no writes)
        run: npm run ss -- "milk"
