name: Item actions (reset / not in use)

# The buttons in the page's "Recently bought · not searched" section. The page is
# static and holds no credentials, so a button either opens a pre-filled issue on
# this repo (the floor) or fires a repository_dispatch straight at this workflow
# (the one-tap upgrade). This is the privileged half that actually writes.
#
# Deliberately separate from add-to-list.yml: undoing a snooze is a different
# blast radius from writing to the user's Notion, and the two must be readable
# (and revocable) on their own terms.
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [item-action]

# No concurrency group, for the same reason as add-to-list.yml: GitHub cancels a
# PENDING run when a newer one queues in the same group, which would silently
# drop one of two near-simultaneous taps. The cooldowns.json race is handled by
# the rebase-and-retry loop in the commit step instead.

jobs:
  act:
    # The repo is public, so anyone can open an issue. Only the owner's "Item: …"
    # issues are honoured, plus any logins in the ADD_EXTRA_LOGINS repo variable
    # (comma-separated, no spaces) — the same allowlist the Add button uses. The
    # commas around both sides stop "sam" from matching "samantha".
    if: >-
      github.event_name == 'repository_dispatch' ||
      (startsWith(github.event.issue.title, 'Item: ') &&
       contains(
         format(',{0},{1},', github.repository_owner, vars.ADD_EXTRA_LOGINS),
         format(',{0},', github.event.issue.user.login)
       ))
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/cooldowns.json
      issues: write # comment on and close the request

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The data files exactly as this run found them. If the push is rejected
      # because another tap landed first, this is the "base" of the three-way
      # merge that re-applies our change onto theirs — see the commit step.
      - name: Snapshot the data files
        run: |
          mkdir -p /tmp/data-base
          cp data/*.json /tmp/data-base/ 2>/dev/null || true

      - name: Apply the action
        id: act
        run: npm run item-action
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Only "Add to Ingredients" uses this — it looks up the product's macros
          # before writing the row. Unset is a supported state: the row is created
          # without nutrition figures and the reply says so, rather than failing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ACTION_PAYLOAD: ${{ toJSON(github.event.client_payload) }}

      - name: Commit the data change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cooldowns.json — reset / not in use / ignore for the week.
          # exclusions.json — mismatch / almost-but-no / ignore / never buy again.
          # purchases.json — which bought rows have been filed into Ingredients.
          # One action writes one file, but staging all three keeps this step
          # honest as actions are added.
          git add data/cooldowns.json data/exclusions.json data/purchases.json
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "item action: applied from the deals page"

          # What this run meant to end up with. Captured ONCE, before the retry
          # loop: every attempt re-applies this same intent onto the newest
          # remote, so a third run landing mid-retry can't be mistaken for ours.
          mkdir -p /tmp/data-mine
          cp data/*.json /tmp/data-mine/ 2>/dev/null || true

          # ⚠️ Do NOT go back to `git pull --rebase` here. It replays our commit,
          # and two entries appended to the same JSON array seconds apart is a
          # content conflict it cannot resolve — the run then dies AFTER the page
          # has already said "✓ ignored". That lost three real corrections on
          # 2026-08-05. Instead: take the new remote wholesale, re-apply our own
          # change on top of it, and commit that. See src/core/merge-data.ts.
          #
          # A `concurrency` group is not the answer either: GitHub keeps only one
          # run pending per group and cancels the rest, so a burst of taps would
          # lose the middle ones outright (LEARNINGS 2026-07-30).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected — re-merging onto the new remote (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            npx tsx src/scripts/merge-data.ts /tmp/data-base /tmp/data-mine data
            git add data/cooldowns.json data/exclusions.json data/purchases.json
            if git diff --staged --quiet; then
              echo "already applied upstream — nothing left to push"
              exit 0
            fi
            git commit -m "item action: applied from the deals page"
          done
          echo "::error::could not push the data change after 5 attempts"
          exit 1

      - name: Close the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.act.outputs.summary }}
          OK: ${{ steps.act.outcome }}
        run: |
          if [ "$OK" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "$RESULT"
            gh issue close "${{ github.event.issue.number }}"
          else
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Failed — see the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
