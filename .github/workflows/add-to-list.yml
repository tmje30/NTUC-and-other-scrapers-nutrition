name: Add to grocery list

# The deals page is static, so its "Add" button can't hold a Notion token. It
# instead opens a pre-filled issue on this repo; this workflow is the privileged
# half that actually writes to Notion and records the cooldown.
#
# repository_dispatch is the same job reached a different way — used by the
# optional Cloudflare Worker (see cloudflare/) for a genuine one-tap flow.
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [add-to-list]

# NO concurrency group here, deliberately. Serialising looks like the safe
# choice, but GitHub cancels a PENDING run when a newer one queues in the same
# group — so with two people adding, a third tap would silently delete the
# second one's add. The race it was guarding (two runs pushing cooldowns.json)
# is handled properly instead, by the rebase-and-retry loop in the commit step.

jobs:
  add:
    # The repo is public, so anyone can open an issue. Only the owner's "Add: …"
    # issues are honoured, plus any logins listed in the ADD_EXTRA_LOGINS repo
    # variable (comma-separated, no spaces) — that's how a partner sharing the
    # page gets to use the two-tap fallback. The commas around both sides stop
    # "sam" from matching "samantha".
    if: >-
      github.event_name == 'repository_dispatch' ||
      (startsWith(github.event.issue.title, 'Add: ') &&
       contains(
         format(',{0},{1},', github.repository_owner, vars.ADD_EXTRA_LOGINS),
         format(',{0},', github.event.issue.user.login)
       ))
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/cooldowns.json
      issues: write # comment on and close the request
    # Whether the shopping list actually moved. The rebuild below gates on it, so a Buy
    # that changed nothing (same item, same amount) costs no scan.
    outputs:
      listChanged: ${{ steps.fragment.outputs.changed }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The data files exactly as this run found them — the "base" of the
      # three-way merge used when a push is rejected. See the commit step.
      - name: Snapshot the data files
        run: |
          mkdir -p /tmp/data-base
          cp data/*.json /tmp/data-base/ 2>/dev/null || true

      - name: Write the Notion row and start the cooldown
        id: add
        run: npm run add
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ADD_PAYLOAD: ${{ toJSON(github.event.client_payload) }}

      # Two adds landing together both push to main. Rather than serialising the
      # whole workflow (which loses adds — see above), let them collide: the loser
      # takes the winner's commit wholesale and re-applies its own change on top.
      - name: Commit the cooldown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cooldowns.json — the snooze. purchases.json — the permanent record of
          # what was bought, which is what the history page lists and the only
          # place this system remembers a price it once saw.
          git add data/cooldowns.json data/purchases.json
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "add: snoozed and logged the purchase"

          # What this run meant to end up with. Captured ONCE, before the retry
          # loop, so every attempt re-applies this same intent onto the newest
          # remote rather than picking up a third run's work as if it were ours.
          mkdir -p /tmp/data-mine
          cp data/*.json /tmp/data-mine/ 2>/dev/null || true

          # ⚠️ Do NOT go back to `git pull --rebase` here — it replays our commit,
          # and two entries appended to the same JSON array is a content conflict
          # it cannot resolve. The run then fails after the Notion row has ALREADY
          # been written, leaving an item on the grocery list with no cooldown and
          # no purchase-log row. See src/core/merge-data.ts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected — re-merging onto the new remote (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            npx tsx src/scripts/merge-data.ts /tmp/data-base /tmp/data-mine data
            git add data/cooldowns.json data/purchases.json
            if git diff --staged --quiet; then
              echo "already applied upstream — nothing left to push"
              exit 0
            fi
            git commit -m "add: snoozed and logged the purchase"
          done
          echo "::error::could not push the cooldown after 5 attempts"
          exit 1

      # ⚠️⚠️ **Without this the tap lands in Notion and vanishes.** `list.html` is a static
      # file: only a publish puts new rows on it, and the only thing that publishes is
      # `daily.yml`, which runs the whole ~4-minute shop scan first. Measured 2026-10-06: four Buy taps
      # from the deals page all succeeded at 10:11 UTC and none of them reached the page,
      # so they were pressed again at 10:13 and every amount became 2.
      #
      # `data/list-live.json` is the fast path — the page fetches it from raw on load and
      # swaps the rows in, so a tap shows up within the file's 5-minute cache rather than
      # at tomorrow's scan. Same step tg-inbox.yml runs for a texted list.
      #
      # ⚠️ **`continue-on-error`, always.** The Notion write has already succeeded by here
      # and the user has already been told so. A Notion hiccup while re-reading the list
      # must not turn that into a red run; the page just stays as it was.
      #
      # ⚠️ **Regenerated on a rejected push, never merged.** The file is derived from
      # Notion, so two taps racing have no conflict to resolve — Notion holds both rows
      # already and a fresh read is truer than either side's copy. `merge-data` knows
      # nothing about this file (see DATA_FILES), so the reset would otherwise leave the
      # other run's older snapshot in place.
      - name: Snapshot the list for the page
        id: fragment
        if: always()
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⚠️ **The output is written HERE, once, and never by `build-list-fragment`.**
          # The loop below may run that script five times, and five `changed=` lines in
          # GITHUB_OUTPUT is not a boolean — Actions keeps the last, so a retry that found
          # nothing would silently overrule the attempt that found something. Clearing
          # GITHUB_OUTPUT for the call is what keeps the script from writing its own.
          say() { echo "changed=$1" >> "$GITHUB_OUTPUT"; }
          for attempt in 1 2 3 4 5; do
            GITHUB_OUTPUT= npm run build-list-fragment || { say false; exit 0; }
            git add data/list-live.json
            if git diff --staged --quiet; then
              echo "snapshot unchanged"
              say false
              exit 0
            fi
            git commit -m "data: list snapshot"
            if git push; then
              say true
              exit 0
            fi
            echo "push rejected — regenerating onto the new remote (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
          done
          # ⚠️ Five rejected pushes and the snapshot never landed, so there is nothing for
          # a rebuild to publish that this run put there. `false`, not `true`: a scan
          # fired on a failed write would look like a fix and change nothing.
          say false
          echo "::warning::could not push the list snapshot — the page stays a scan behind"
      - name: Close the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.add.outputs.summary }}
          OK: ${{ steps.add.outcome }}
        run: |
          if [ "$OK" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "$RESULT"
            gh issue close "${{ github.event.issue.number }}"
          else
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Failed to add this — see the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi

  # ⚠️⚠️ **The slow half, and the one that makes the page itself correct.** The snapshot
  # above puts the row on the page within the file's cache window; it does NOT rebuild
  # list.html, so the page's own baked content — prices, totals, the "built at" line —
  # stays from the last scan. tg-inbox.yml has had this job since the texted-list fix;
  # a Buy from the deals page had no equivalent until now (user, 2026-10-07).
  #
  # ⚠️ **Gated on the output, not on "the job succeeded".** A Buy that changed nothing —
  # the same item at the same amount — must not cost a four-shop scan. Same rule
  # tg-inbox.yml and price-new-items.yml already apply.
  #
  # ⚠️⚠️ **Collapsed, because Buys arrive in bursts.** Four taps in two minutes is the
  # measured shape of a shopping session (2026-10-06, 10:11–10:14), and daily.yml's own
  # `concurrency: pages` would QUEUE four full scans rather than drop three — sixteen
  # minutes of runner time, four deploys, and four shops asked the same questions for one
  # trip. The last tap's scan sees everything the earlier ones wrote, so cancelling a
  # superseded rebuild loses nothing. (If that last one fails, nothing publishes — but
  # the rows are already on the page via the snapshot, which is the point of having both.)
  #
  # ⚠️ `quiet: true`: the page has already answered the tap. A Telegram digest here would
  # be a second notification for one button press.
  #
  # ⚠️ The permissions must be granted HERE, not only in daily.yml — a called workflow's
  # token is capped by the caller's, so inheriting `contents: write` alone would strip
  # `pages: write` and the deploy would fail after the scan had already run.
  rebuild:
    needs: add
    if: needs.add.outputs.listChanged == 'true'
    concurrency:
      group: buy-rebuild
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/daily.yml
    with:
      quiet: true
    secrets: inherit
