name: Add to grocery list

# The deals page is static, so its "Add" button can't hold a Notion token. It
# instead opens a pre-filled issue on this repo; this workflow is the privileged
# half that actually writes to Notion and records the cooldown.
#
# repository_dispatch is the same job reached a different way — used by the
# optional Cloudflare Worker (see cloudflare/) for a genuine one-tap flow.
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [add-to-list]

# NO concurrency group here, deliberately. Serialising looks like the safe
# choice, but GitHub cancels a PENDING run when a newer one queues in the same
# group — so with two people adding, a third tap would silently delete the
# second one's add. The race it was guarding (two runs pushing cooldowns.json)
# is handled properly instead, by the rebase-and-retry loop in the commit step.

jobs:
  add:
    # The repo is public, so anyone can open an issue. Only the owner's "Add: …"
    # issues are honoured, plus any logins listed in the ADD_EXTRA_LOGINS repo
    # variable (comma-separated, no spaces) — that's how a partner sharing the
    # page gets to use the two-tap fallback. The commas around both sides stop
    # "sam" from matching "samantha".
    if: >-
      github.event_name == 'repository_dispatch' ||
      (startsWith(github.event.issue.title, 'Add: ') &&
       contains(
         format(',{0},{1},', github.repository_owner, vars.ADD_EXTRA_LOGINS),
         format(',{0},', github.event.issue.user.login)
       ))
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/cooldowns.json
      issues: write # comment on and close the request

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # The data files exactly as this run found them — the "base" of the
      # three-way merge used when a push is rejected. See the commit step.
      - name: Snapshot the data files
        run: |
          mkdir -p /tmp/data-base
          cp data/*.json /tmp/data-base/ 2>/dev/null || true

      - name: Write the Notion row and start the cooldown
        id: add
        run: npm run add
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ADD_PAYLOAD: ${{ toJSON(github.event.client_payload) }}

      # Two adds landing together both push to main. Rather than serialising the
      # whole workflow (which loses adds — see above), let them collide: the loser
      # takes the winner's commit wholesale and re-applies its own change on top.
      - name: Commit the cooldown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cooldowns.json — the snooze. purchases.json — the permanent record of
          # what was bought, which is what the history page lists and the only
          # place this system remembers a price it once saw.
          git add data/cooldowns.json data/purchases.json
          if git diff --staged --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "add: snoozed and logged the purchase"

          # What this run meant to end up with. Captured ONCE, before the retry
          # loop, so every attempt re-applies this same intent onto the newest
          # remote rather than picking up a third run's work as if it were ours.
          mkdir -p /tmp/data-mine
          cp data/*.json /tmp/data-mine/ 2>/dev/null || true

          # ⚠️ Do NOT go back to `git pull --rebase` here — it replays our commit,
          # and two entries appended to the same JSON array is a content conflict
          # it cannot resolve. The run then fails after the Notion row has ALREADY
          # been written, leaving an item on the grocery list with no cooldown and
          # no purchase-log row. See src/core/merge-data.ts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected — re-merging onto the new remote (attempt $attempt)"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            npx tsx src/scripts/merge-data.ts /tmp/data-base /tmp/data-mine data
            git add data/cooldowns.json data/purchases.json
            if git diff --staged --quiet; then
              echo "already applied upstream — nothing left to push"
              exit 0
            fi
            git commit -m "add: snoozed and logged the purchase"
          done
          echo "::error::could not push the cooldown after 5 attempts"
          exit 1

      - name: Close the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.add.outputs.summary }}
          OK: ${{ steps.add.outcome }}
        run: |
          if [ "$OK" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "$RESULT"
            gh issue close "${{ github.event.issue.number }}"
          else
            gh issue comment "${{ github.event.issue.number }}" \
              --body "❌ Failed to add this — see the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
