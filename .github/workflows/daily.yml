name: Daily grocery deal scan

on:
  schedule:
    # ⚠️⚠️ **This is the BACKSTOP, not the clock.** The clock is ss-worker's Cloudflare
    # cron: it scans Sheng Siong from 09:00 SGT, commits the file, and fires a
    # `rescan` dispatch that runs this whole workflow promptly. That is what has
    # published the page every morning since 2026-08-14.
    #
    # ⚠️ Until 2026-08-18 this cron ALSO ran, so the full job ran TWICE every morning
    # — 09:01 from the Worker and ~09:15 from here — and `npm run notify` has no
    # condition on it, so two identical digests arrived every day for five days.
    # Nobody had noticed, which is exactly why it is written down here.
    #
    # 03:30 UTC = 11:30 SGT, deliberately AFTER the Worker's last retry at 11:00.
    # Firing earlier would race the thing it is meant to cover for. The `guard` job
    # below then skips this run entirely if the page has already been built today, so
    # a second digest arrives only on a morning the Worker never managed one — which
    # is the morning you would want it.
    #
    # ⚠️ The old 00:00 UTC value was a FLOOR on scrape time (user, 2026-08-11): a
    # discount read at 5am may not be the one on the shelf. 11:30 respects that floor
    # comfortably. A cron set early to *land* at 08:00 was tried and reverted the same
    # day — the queue delay is a queue, not a promise.
    - cron: "30 3 * * *"
  # ⚠️ `drill` fires the failure notifier ON PURPOSE. It is the only way to prove
  # that step works: it had been written for five days and never once run, because
  # nothing had failed — the same shape of assumption that made "the cloud scan is
  # live" wrong. A drill run fails deliberately and therefore shows a red X; that is
  # what it is for.
  workflow_dispatch: # allow manual runs from the Actions tab
    inputs:
      drill:
        description: "Fire the failure notifier deliberately (the run WILL fail — that is the test)"
        type: boolean
        default: false
      test_backstop:
        description: "Make the guard decide as if this were the 11:30 backstop (sends nothing if the page is already built)"
        type: boolean
        default: false
  # ⚠️ `rescan` is now the PRIMARY trigger, not a repair button. ss-worker fires it
  # from Singapore the moment its 09:00 scan commits, and that is what publishes the
  # page every morning. The page's own Rescan button — shown when a shop is missing
  # from the scan — sends the same event by hand.
  #
  # ⚠️ The old note here said the usual cause was the laptop being shut at 05:30 and
  # Task Scheduler running the missed scan on wake. That has been wrong since
  # 2026-08-17: every scheduled task on the laptop is disabled and nothing in this
  # system runs there any more.
  # `newitems` is the Telegram poller asking for a rebuild after it has priced
  # items the user texted and committed data/new-items-latest.json. It runs the
  # same job — the new-items page is written by build-site alongside the other
  # two, so there is nothing extra to deploy and no second Pages artifact that
  # could overwrite the deals page.
  repository_dispatch:
    types: [rescan, newitems]
  # ⚠️ Callable so `price-new-items.yml` can rebuild the site itself after pricing.
  # It cannot use the `newitems` dispatch above: GitHub refuses to start a workflow
  # from a `repository_dispatch` sent with a workflow's own `GITHUB_TOKEN`, and does
  # so SILENTLY (204, nothing runs). A dependent job is the supported way for one
  # workflow to trigger another without minting a PAT for it.
  workflow_call:

# Needed for the GitHub Pages deploy. `actions: read` is what deploy-pages needs
# to resolve the uploaded artifact by id (documented from its v4); the run has
# been getting away without it, so it's added here before a future version
# starts enforcing what the docs already ask for.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Don't let overlapping runs clobber the Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ⚠️ Asks one question, and only of the scheduled run: has the page already been
  # built today? Every other trigger — the Worker's rescan, the Rescan button,
  # new-item pricing, a manual dispatch — is someone asking for a build on purpose
  # and is never second-guessed.
  guard:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.test_backstop }}" != "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Trigger is ${{ github.event_name }} — someone asked for this build. Running."
            exit 0
          fi
          # ⚠️ Today in SINGAPORE, not in UTC. The 09:01 SGT run is 01:01 UTC the same
          # day, but an evening rebuild would land on the NEXT UTC day and would make
          # this look as though nothing had run.
          today=$(TZ=Asia/Singapore date +%F)
          # ⚠️⚠️ **`--repo` is load-bearing, and leaving it out broke this for four
          # mornings (2026-08-19 to 08-22).** This job has no `actions/checkout`, so
          # `gh` has no git remote to infer the repository from and dies with
          # "failed to determine base repo" — which failed the job, skipped `scan`,
          # and took the failure notifier down with it because that step lives in
          # `scan`. Four silent failures. Passing the repo explicitly is cheaper than
          # a checkout and removes the inference entirely.
          #
          # ⚠️ `|| true` is the other half: the claim in HANDOVER was that this fails
          # TOWARD publishing, and it did not. Under `bash -e` a failed command
          # substitution kills the step, so an API blip meant no page at all rather
          # than a duplicate digest. Now an empty result falls through to 0 below and
          # the backstop runs.
          built=$(gh run list --repo "${{ github.repository }}" --workflow=daily.yml \
            --status=success --limit 30 --json createdAt \
            --jq "[.[] | select((.createdAt | fromdateiso8601 + 28800 | strftime(\"%Y-%m-%d\")) == \"$today\")] | length" || true)
          echo "Successful builds already today (SGT $today): ${built:-<could not tell>}"
          if [ "${built:-0}" -gt 0 ] 2>/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The page was already built today — the backstop is standing down."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Nothing built the page today (or the check could not tell), so the backstop is running it."
          fi
  scan:
    needs: guard
    # ⚠️⚠️ **Fail OPEN, and note what this is not: it is not `== 'true'`.** A guard
    # that errors produces no output at all, and the old condition read that as
    # "don't build" — so between 2026-08-19 and 08-22 a one-line bug in the guard
    # silently stopped the backstop four mornings running, AND suppressed the
    # failure notifier, which lives in this job and therefore never ran.
    #
    # Only an explicit `false` — the guard having actually looked and found today's
    # page already built — stands this down. Anything else builds. A duplicate
    # digest is a nuisance; a missing page nobody is told about is the failure this
    # whole workflow exists to prevent.
    if: ${{ !cancelled() && needs.guard.outputs.needed != 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # ⚠️ FIRST, so a drill costs seconds rather than a full scan and a Pages
      # deploy. Everything below it is skipped once this fails.
      - name: Drill — fail on purpose, so the notifier has something to report
        if: github.event_name == 'workflow_dispatch' && inputs.drill
        run: |
          echo "::notice::Failure-notifier drill — failing deliberately. Nothing was scanned."
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Scan stores and build the deals page
        run: npm run build-site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send Telegram summary (links to the freshly deployed page)
        run: npm run notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}

      # ⚠️ **Silence is the failure mode this exists to remove.** A partial failure
      # already speaks for itself: `build-site` writes a `warning` into summary.json
      # (e.g. "Sheng Siong is missing from this scan") and `sendSummary` puts it in
      # the same message as the deals, sending even on a zero-deal day. But when the
      # run dies *before* that step — a store throwing, Notion refusing, the deploy
      # failing — nothing is sent at all, and a broken morning looks exactly like a
      # morning with no discounts. This says so out loud instead.
      #
      # ⚠️ **Raw curl, not `npm run notify`, and that is the point.** Two of the most
      # likely breakages are `setup-node` and `npm ci`, which leave no node_modules
      # for a script to run in. A notifier that depends on the thing that just failed
      # goes quiet exactly when it is needed. curl is on every GitHub runner.
      #
      # `failure()` already excludes cancellations, so stopping a run by hand stays
      # quiet. It does not fire if the runner itself dies — nothing can cover that.
      - name: Say so in Telegram if the run failed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.drill }}
        run: |
          # ⚠️ A drill says so IN THE MESSAGE. A test that arrives looking like a
          # real outage teaches the reader to distrust the alarm, which costs more
          # than never having tested it.
          if [ "${DRILL}" = "true" ]; then
            TEXT="🧪 <b>Drill — the failure notifier works.</b>
          Nothing is wrong. This run failed on purpose to prove this message can still reach you.
          <a href=\"${RUN_URL}\">The drill run →</a>"
          else
            TEXT="🛑 <b>The grocery scan failed — nothing is working.</b>
          No prices were checked today, so there is no deals list and no page update.
          <a href=\"${RUN_URL}\">See what broke →</a>

          You can retry from the Rescan button, or from the Actions tab."
          fi
          resp=$(curl -sS --max-time 30 -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}")
          echo "$resp"
          # ⚠️ **curl exits 0 when Telegram REFUSES the message**, so a green step is
          # not delivery — only `"ok":true` is. A wrong chat id, a revoked bot token or
          # broken HTML would each have looked like a working alarm. Seen on the first
          # drill, 2026-08-18: the step passed, and the proof of delivery was in the
          # response body rather than in the exit code.
          case "$resp" in
            *'"ok":true'*) ;;
            *) echo "::error::Telegram refused the failure notice — the alarm itself is broken."; exit 1 ;;
          esac
