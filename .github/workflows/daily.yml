name: Daily grocery deal scan

on:
  schedule:
    # 02:00 UTC = 10:00 Singapore time (UTC+8), once daily.
    - cron: "0 2 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab
  # The page's "Rescan" button, shown only when a shop is missing from the scan.
  # The usual cause is the laptop being shut at 05:30: Task Scheduler runs the
  # missed Sheng Siong scan when the laptop next wakes, so by mid-morning fresh
  # prices ARE in the repo — but nothing rebuilds the 10:00 page, which sits
  # there FairPrice-only all day. This lets that page rebuild itself on request.
  repository_dispatch:
    types: [rescan]

# Needed for the GitHub Pages deploy. `actions: read` is what deploy-pages needs
# to resolve the uploaded artifact by id (documented from its v4); the run has
# been getting away without it, so it's added here before a future version
# starts enforcing what the docs already ask for.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Don't let overlapping runs clobber the Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Scan stores and build the deals page
        run: npm run build-site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send Telegram summary (links to the freshly deployed page)
        run: npm run notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
