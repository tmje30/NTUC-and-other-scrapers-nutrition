name: Daily grocery deal scan

on:
  schedule:
    # 22:00 UTC = 06:00 Singapore time (UTC+8), once daily.
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

# Needed for the GitHub Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let overlapping runs clobber the Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Scan stores and build the deals page
        run: npm run build-site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ACTIVE_PLAN_NUMBER: ${{ vars.ACTIVE_PLAN_NUMBER || '1' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Send Telegram summary (links to the freshly deployed page)
        run: npm run notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
