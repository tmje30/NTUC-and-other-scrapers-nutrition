# Throwaway probe — NOT part of the running system. See worker.mjs.
#
#   cd probe/placement
#   npx wrangler deploy              then hit <name>.<subdomain>.workers.dev/?tries=8
#   npx wrangler delete              when you have your answer
#
# ⚠️ **This one has to be DEPLOYED**, unlike the sibling probe. Wrangler has
# dropped Durable Object support from `wrangler dev --remote` (it errors on every
# stub call), and plain `wrangler dev` runs the objects on this laptop — which
# would place them all in Singapore and prove exactly nothing. Deployed is the
# only mode where the placement being measured is Cloudflare's own.
name = "cf-placement-probe"
main = "worker.mjs"
compatibility_date = "2026-08-11"

[[durable_objects.bindings]]
name = "PLACEMENT"
class_name = "Placement"

# ⚠️ `new_sqlite_classes`, not `new_classes`. SQLite-backed Durable Objects are the
# ones available without a paid Workers plan, and the whole point of this probe is
# whether the free tier can host the scan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Placement"]
